# Exomiser 15.1.0 CLI configuration for phenotype-only prioritisation (tool_restriction).
# Based on the distribution's application.properties. The CLI refuses to start without at least one genome assembly
# data version, so the hg19 2512 release is configured as in the distribution default; no VCF is given, so no variant
# data are used (phenotype-only preset).
exomiser.data-directory=/data/hohndor/pavs-tools/exomiser/data
exomiser.hg19.data-version=2512
exomiser.phenotype.data-version=2512
spring.cache.type=none
logging.level.com.zaxxer.hikari=ERROR
